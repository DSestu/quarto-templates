<script>
// Draws marimo's web-component outputs without marimo's frontend:
// <marimo-plotly> and <marimo-table> (marimo outputs), <dsestu-vega> (written by dsestu-render).
(function () {
  "use strict";

  var loaded = {}, pending = 0, amd;
  // Quarto loads require.js for notebooks; hide define() until every CDN bundle has set its global.
  function load(src) {
    return loaded[src] || (loaded[src] = new Promise(function (resolve, reject) {
      if (pending++ === 0) { amd = window.define; window.define = undefined; }
      function done() { if (--pending === 0) window.define = amd; }
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { done(); resolve(); };
      s.onerror = function () { done(); reject(new Error("failed to load " + src)); };
      document.head.appendChild(s);
    }));
  }
  function loadAll(srcs) {
    return srcs.reduce(function (p, src) { return p.then(function () { return load(src); }); }, Promise.resolve());
  }
  // marimo double-encodes some attributes (a JSON string holding JSON).
  function attr(el, name) {
    var v = JSON.parse(el.getAttribute(name));
    return typeof v === "string" ? JSON.parse(v) : v;
  }
  function define(tag, render) {
    if (customElements.get(tag)) return;
    customElements.define(tag, class extends HTMLElement {
      connectedCallback() {
        if (this.dataset.drawn) return;
        this.dataset.drawn = "1";
        this.style.display = "block";
        try { render(this); } catch (e) { console.error(tag, e); }
      }
    });
  }

  define("marimo-plotly", function (el) {
    var fig = attr(el, "data-figure");
    var config = el.hasAttribute("data-config") ? attr(el, "data-config") : {};
    load("https://cdn.plot.ly/plotly-2.35.2.min.js").then(function () {
      window.Plotly.newPlot(el, fig.data, fig.layout, Object.assign({ responsive: true }, config));
    });
  });

  define("dsestu-vega", function (el) {
    var spec = attr(el, "data-spec");
    loadAll([
      "https://cdn.jsdelivr.net/npm/vega@6/build/vega.min.js",
      "https://cdn.jsdelivr.net/npm/vega-lite@6/build/vega-lite.min.js",
      "https://cdn.jsdelivr.net/npm/vega-embed@7/build/vega-embed.min.js"
    ]).then(function () { return window.vegaEmbed(el, spec, { actions: false }); });
  });

  // Search, sort, paging and CSV download over the rows marimo saved (all of them with mo.ui.table(df, pagination=False)).
  define("marimo-table", function (el) {
    var rows = attr(el, "data-data");
    if (!Array.isArray(rows)) return;
    function opt(name, fallback) {
      var v = el.hasAttribute(name) ? attr(el, name) : null;
      return v === null ? fallback : v;
    }
    var types = opt("data-field-types", []), hidden = opt("data-hidden-columns", []);
    var cols = (types.length ? types.map(function (t) { return t[0]; }) : Object.keys(rows[0] || {}))
      .filter(function (c) { return c !== "_marimo_row_id" && hidden.indexOf(c) < 0; });
    var kind = {}, dtype = {};
    types.forEach(function (t) { kind[t[0]] = t[1][0]; dtype[t[0]] = t[1][1]; });
    var total = opt("data-total-rows", rows.length);
    // without pagination marimo sets page-size to the row count
    var size = opt("data-pagination", true) ? opt("data-page-size", 10) : 10;
    var query = "", sortCol = null, sortDir = 1, page = 0, view = rows;

    function h(tag, cls, parent, txt) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt !== undefined) e.textContent = txt;
      if (parent) parent.appendChild(e);
      return e;
    }
    function text(v) { return v === null || v === undefined ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); }
    function isNum(c) { return kind[c] === "integer" || kind[c] === "number"; }
    function compare(a, b) {
      var x = a[sortCol], y = b[sortCol], nx = x === null || x === undefined, ny = y === null || y === undefined;
      if (nx || ny) return nx - ny; // nulls last in both directions
      return sortDir * (typeof x === "number" && typeof y === "number" ? x - y : text(x).localeCompare(text(y), undefined, { numeric: true }));
    }
    function refresh() {
      var q = query.toLowerCase();
      view = q ? rows.filter(function (r) { return cols.some(function (c) { return text(r[c]).toLowerCase().indexOf(q) >= 0; }); }) : rows.slice();
      if (sortCol !== null) view.sort(compare);
      page = 0;
      draw();
    }
    function download() {
      function esc(v) { var s = text(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
      var lines = [cols.map(esc).join(",")].concat(view.map(function (r) { return cols.map(function (c) { return esc(r[c]); }).join(","); }));
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
      a.download = "table.csv";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }

    el.replaceChildren();
    var bar = h("div", "dt-bar", el);
    if (opt("data-show-search", true) && rows.length > 1) {
      var search = h("input", "dt-search", bar);
      search.type = "search";
      search.placeholder = "Search";
      search.setAttribute("aria-label", "Search table");
      search.addEventListener("input", function () { query = search.value; refresh(); });
    }
    var count = h("span", "dt-count", bar);
    if (opt("data-show-download", true)) h("button", "dt-btn", bar, "CSV").addEventListener("click", download);

    var table = h("table", "table table-sm", h("div", "dt-scroll", el));
    var head = table.createTHead().insertRow(), body = table.createTBody();
    var ths = cols.map(function (c) {
      var th = h("th", isNum(c) ? "dt-num" : "", head);
      var btn = h("button", "dt-sort", th, c);
      if (dtype[c]) h("span", "dt-type", btn, dtype[c]);
      btn.addEventListener("click", function () {
        // asc -> desc -> unsorted
        if (sortCol !== c) { sortCol = c; sortDir = 1; } else if (sortDir === 1) sortDir = -1; else sortCol = null;
        refresh();
      });
      return th;
    });

    var foot = h("div", "dt-foot", el);
    var prev = h("button", "dt-btn", foot, "‹"), label = h("span", "", foot), next = h("button", "dt-btn", foot, "›");
    prev.setAttribute("aria-label", "Previous page");
    next.setAttribute("aria-label", "Next page");
    prev.addEventListener("click", function () { page--; draw(); });
    next.addEventListener("click", function () { page++; draw(); });
    var sizes = [10, 25, 50, 100].concat([10, 25, 50, 100].indexOf(size) < 0 ? [size] : []).sort(function (a, b) { return a - b; });
    var select = h("select", "dt-btn", foot);
    select.setAttribute("aria-label", "Rows per page");
    sizes.forEach(function (s) { h("option", "", select, s + " / page").value = s; });
    select.value = size;
    select.addEventListener("change", function () { size = +select.value; page = 0; draw(); });
    foot.hidden = rows.length <= sizes[0];

    function draw() {
      var pages = Math.max(1, Math.ceil(view.length / size));
      body.replaceChildren();
      view.slice(page * size, (page + 1) * size).forEach(function (r) {
        var tr = body.insertRow();
        cols.forEach(function (c) { var td = tr.insertCell(); td.textContent = text(r[c]); if (isNum(c)) td.className = "dt-num"; });
      });
      ths.forEach(function (th, i) {
        th.setAttribute("aria-sort", cols[i] !== sortCol ? "none" : sortDir === 1 ? "ascending" : "descending");
      });
      var n = rows.length.toLocaleString();
      var all = typeof total === "number" && total > rows.length ? "first " + n + " of " + total.toLocaleString() + " rows" : n + " rows";
      count.textContent = query ? view.length.toLocaleString() + " match in " + all : all;
      label.textContent = "Page " + (page + 1) + " of " + pages;
      prev.disabled = page === 0;
      next.disabled = page >= pages - 1;
    }
    draw();
  });
})();
</script>
