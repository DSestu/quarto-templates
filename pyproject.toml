[project]
name = "dsestu-render"
version = "1.0.0"
description = "Render marimo (.py) and Jupyter (.ipynb) notebooks with the dsestu Quarto templates, without executing them"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["marimo>=0.25", "nbformat"]

[project.scripts]
dsestu-render = "dsestu_render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsestu_render"]

# Ship the Quarto extensions inside the package, so no `quarto add` is needed to render.
[tool.hatch.build.targets.wheel.force-include]
"_extensions" = "dsestu_render/_extensions"
